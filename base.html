<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f5f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0e10" media="(prefers-color-scheme: dark)">
<title>Tidal Soundscape</title>
<style>
:root{
  color-scheme:light dark;
  --bg:#f3f5f5;
  --bg2:#e9edef;
  --ink:#1c272d;
  --muted:#6f7c83;
  --muted2:#9aa5aa;
  --line:rgba(33,56,66,.12);
  --ring:#a9cad8;
  --ring-hi:#e5f3f8;
  --ring-warm:#e8ddc8;
  --glass:rgba(255,255,255,.68);
  --glass-line:rgba(24,48,58,.08);
  --shadow:rgba(44,75,89,.08);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0b0e10;
    --bg2:#11171a;
    --ink:#eef4f5;
    --muted:#8d999f;
    --muted2:#667177;
    --line:rgba(220,240,246,.13);
    --ring:#6f9daf;
    --ring-hi:#b9dce8;
    --ring-warm:#9b8e78;
    --glass:rgba(19,25,28,.62);
    --glass-line:rgba(226,244,248,.08);
    --shadow:rgba(0,0,0,.30);
  }
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink)}
body{
  min-height:100svh;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Hiragino Sans","Noto Sans JP",sans-serif;
  background:
    radial-gradient(circle at 50% 18%,color-mix(in srgb,var(--ring-hi) 8%,transparent),transparent 35%),
    linear-gradient(180deg,var(--bg),var(--bg2));
  transition:background .5s ease,color .5s ease;
  overflow-x:hidden;
}
button,input{font:inherit}
button{cursor:pointer}
main{
  width:min(760px,100%);
  min-height:100svh;
  margin:auto;
  padding:max(22px,env(safe-area-inset-top)) 20px max(40px,env(safe-area-inset-bottom));
  display:flex;
  flex-direction:column;
}
.topbar{
  min-height:44px;display:flex;justify-content:flex-end;align-items:center;
}
.more{
  width:38px;height:38px;border-radius:50%;border:1px solid var(--glass-line);
  background:var(--glass);color:var(--muted);backdrop-filter:blur(18px);
  font-size:18px;line-height:1;
}
.stage{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:4vh 0 7vh;
}
.brand{text-align:center;margin-bottom:clamp(28px,5vh,48px)}
.brand h1{
  margin:0;font-family:serif;font-weight:400;
  font-size:clamp(38px,8vw,58px);letter-spacing:.22em;padding-left:.22em;
}
.brand p{
  margin:9px 0 0;font-size:10px;letter-spacing:.23em;color:var(--muted2);
}
.ring-button{
  appearance:none;border:0;background:transparent;padding:0;
  width:min(74vw,390px);aspect-ratio:1;border-radius:50%;
  position:relative;display:grid;place-items:center;
  color:var(--ink);-webkit-tap-highlight-color:transparent;
}
.ring-svg{
  position:absolute;inset:0;width:100%;height:100%;overflow:visible;
  filter:drop-shadow(0 14px 34px var(--shadow));
}
.ring-track{
  fill:none;stroke:url(#tidalGradient);stroke-width:4.5;stroke-linecap:round;
  transform-origin:210px 210px;opacity:.58;
  transition:opacity .7s ease,filter .7s ease;
}
.ring-glow{
  fill:none;stroke:var(--ring-hi);stroke-opacity:.11;stroke-width:16;
  transform-origin:210px 210px;filter:blur(11px);
}
body.playing .ring-track{opacity:.98}
body.forward.playing .ring-track{animation:rotateF var(--rotation-duration,48s) linear infinite}
body.reverse.playing .ring-track{animation:rotateR var(--rotation-duration,48s) linear infinite}
body.still .ring-track{animation-play-state:paused;opacity:.62}
body.tremolo .ring-track{
  animation:
    var(--dir-animation,rotateF) var(--rotation-duration,48s) linear infinite,
    ringRipple 3.4s ease-in-out infinite;
}
@keyframes rotateF{to{transform:rotate(360deg)}}
@keyframes rotateR{to{transform:rotate(-360deg)}}
@keyframes ringRipple{
  0%,100%{stroke-width:4.5;filter:drop-shadow(0 0 0 transparent)}
  50%{stroke-width:6.2;filter:drop-shadow(0 0 12px color-mix(in srgb,var(--ring-hi) 26%,transparent))}
}
.ring-inner{
  width:66%;aspect-ratio:1;border-radius:50%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;position:relative;
}
.ring-state{
  font-size:12px;color:var(--muted);letter-spacing:.14em;margin-bottom:10px;
}
.ring-level{
  font-size:clamp(46px,12vw,72px);font-weight:280;letter-spacing:-.06em;
  font-variant-numeric:tabular-nums;line-height:1;
}
.ring-level small{font-size:14px;font-weight:400;letter-spacing:0;color:var(--muted);margin-left:6px}
.ring-action{
  margin-top:16px;font-size:11px;color:var(--muted2);letter-spacing:.10em;
}
.readout{
  margin-top:clamp(32px,5vh,48px);
  display:flex;align-items:center;justify-content:center;gap:12px 18px;flex-wrap:wrap;
  color:var(--muted);font-size:12px;
}
.readout span+span:before{content:"・";margin-right:16px;color:var(--muted2)}
.live{
  margin-top:18px;font-size:10px;color:var(--muted2);letter-spacing:.09em;text-align:center;
}
.live i{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--ring);margin-right:7px;vertical-align:1px}
.panel{
  position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);
  width:min(620px,calc(100vw - 28px));max-height:70svh;overflow:auto;
  border:1px solid var(--glass-line);border-radius:24px;padding:22px;
  background:color-mix(in srgb,var(--glass) 94%,transparent);
  backdrop-filter:blur(28px);box-shadow:0 20px 60px var(--shadow);
  display:none;z-index:20;
}
.panel.open{display:block}
.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.panel-head b{font-size:13px;font-weight:500}
.close{border:0;background:transparent;color:var(--muted);font-size:20px}
.mode{
  display:grid;grid-template-columns:1fr 1fr;gap:6px;
  background:color-mix(in srgb,var(--line) 38%,transparent);border-radius:14px;padding:5px;
}
.mode button{
  border:0;border-radius:10px;padding:10px;background:transparent;color:var(--muted);font-size:11px;
}
.mode button.active{background:var(--glass);color:var(--ink)}
.details{
  margin-top:18px;border-top:1px solid var(--line);padding-top:14px;
  display:grid;gap:10px;font-size:11px;color:var(--muted);
}
.detail-row{display:flex;justify-content:space-between;gap:20px}
.sim{display:none;margin-top:18px;border-top:1px solid var(--line);padding-top:14px}
.sim.show{display:block}
.row{display:grid;grid-template-columns:140px 1fr 65px;gap:10px;align-items:center;margin:13px 0}
.row label{font-size:11px;color:var(--muted)}
.row output{text-align:right;font-size:11px;color:var(--muted)}
input[type=range]{width:100%;accent-color:var(--ring)}
.segment{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.segment button{
  border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:10px;padding:9px;font-size:11px
}
.segment button.active{background:var(--glass);color:var(--ink)}
.layer-solo{grid-template-columns:repeat(6,1fr)}
.layer-solo.disabled{opacity:.34;pointer-events:none;filter:saturate(.65)}
.layer-solo{transition:opacity .18s ease,filter .18s ease}
@media(max-width:560px){
  .layer-solo{grid-template-columns:repeat(3,1fr)}
}
.note{font-size:10px;line-height:1.7;color:var(--muted2);margin:14px 0 0}
@media(max-width:560px){
  .stage{padding-top:1vh}
  .ring-button{width:min(82vw,360px)}
  .row{grid-template-columns:1fr;gap:5px}.row output{text-align:left}
}
</style>

<style>
/* v5 minimal interface */
.topbar,.brand,.more{display:none!important}

main{
  position:relative;
  padding: max(16px,env(safe-area-inset-top)) 16px max(20px,env(safe-area-inset-bottom));
}

.stage{
  padding:0;
  min-height:calc(100svh - max(32px,env(safe-area-inset-top)));
  justify-content:center;
}

.ring-button{
  width:min(76vw,430px);
}

.readout{
  margin-top:clamp(24px,4vh,38px);
  font-size:11px;
}

.live{
  margin-top:13px;
  font-size:9.5px;
}

/* Invisible interaction area in upper-right. */
.top-right-hotspot{
  position:fixed;
  top:0;
  right:0;
  width:120px;
  height:100px;
  z-index:40;
  display:flex;
  align-items:flex-start;
  justify-content:flex-end;
  padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) 0 0;
}

.fullscreen-btn{
  width:38px;
  height:38px;
  border:1px solid var(--glass-line);
  border-radius:50%;
  background:var(--glass);
  color:var(--muted);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  font-size:17px;
  line-height:1;
  opacity:0;
  transform:translateY(-4px) scale(.96);
  pointer-events:none;
  transition:opacity .18s ease,transform .18s ease,background .18s ease;
  box-shadow:0 8px 24px var(--shadow);
}

.top-right-hotspot:hover .fullscreen-btn,
.top-right-hotspot:focus-within .fullscreen-btn{
  opacity:.9;
  transform:translateY(0) scale(1);
  pointer-events:auto;
}

.fullscreen-btn:hover{
  opacity:1!important;
  background:color-mix(in srgb,var(--glass) 78%,var(--ring-hi) 22%);
}

/* On touch devices hover does not exist, so expose fullscreen softly. */
@media (hover:none){
  .fullscreen-btn{
    opacity:.32;
    transform:none;
    pointer-events:auto;
  }
}

/* Secondary settings affordance stays nearly invisible until approached. */
.settings-dot{
  position:fixed;
  right:max(13px,env(safe-area-inset-right));
  bottom:max(13px,env(safe-area-inset-bottom));
  z-index:35;
  width:36px;
  height:36px;
  border:0;
  border-radius:50%;
  background:transparent;
  color:var(--muted2);
  font-size:15px;
  opacity:.06;
  transition:opacity .18s ease,background .18s ease;
}
.settings-dot:hover,.settings-dot:focus-visible{
  opacity:.65;
  background:var(--glass);
}

/* Make the center feel like the only actual control. */
.ring-action{
  opacity:.72;
}
</style>


<style>
/* v6: minimal center copy */
.ring-inner{
  gap:0;
}
.ring-level{
  margin:0;
}
.ring-action{
  margin-top:14px;
  font-size:10px;
  letter-spacing:.08em;
  opacity:.42;
  transition:opacity .25s ease;
}
body.playing .ring-action{
  opacity:0;
}
.readout{
  margin-top:28px;
  font-size:10.5px;
  opacity:.72;
}
.readout span+span:before{display:none}
</style>


<style>
/* v7: show tide value only when stopped */
.ring-level{
  transition: opacity .28s ease, transform .28s ease;
}
body.playing .ring-level{
  opacity: 0;
  transform: scale(.96) translateY(4px);
  pointer-events: none;
}
body:not(.playing) .ring-level{
  opacity: 1;
  transform: scale(1) translateY(0);
}
</style>


<style>
/* v8 — quiet, contemporary, object-like UI */
body{
  background:
    radial-gradient(120% 90% at 50% 2%, color-mix(in srgb,var(--ring-hi) 10%,transparent), transparent 46%),
    linear-gradient(180deg,var(--bg),var(--bg2));
}

.stage{
  min-height:calc(100svh - max(28px,env(safe-area-inset-top)));
  padding-bottom:3vh;
}

.ring-button{
  width:min(70vw,408px);
  transition:transform .45s cubic-bezier(.2,.8,.2,1);
}
.ring-button:hover{
  transform:scale(1.006);
}

.ring-track{
  stroke-width:3.8;
}
.ring-glow{
  stroke-width:20;
  stroke-opacity:.075;
  filter:blur(16px);
}

.ring-level{
  font-size:clamp(42px,10vw,64px);
  font-weight:260;
  letter-spacing:-.055em;
}
.ring-level small{
  font-size:11px;
  opacity:.55;
  margin-left:5px;
}

.ring-action{
  margin-top:12px;
  font-size:9px;
  letter-spacing:.14em;
  opacity:.30;
  text-transform:uppercase;
}

.readout{
  margin-top:30px;
  font-size:10px;
  letter-spacing:.055em;
  opacity:.55;
}

/* Reveal tide value subtly on hover during playback. */
@media (hover:hover){
  body.playing .ring-button:hover .ring-level{
    opacity:.20;
    transform:scale(.98);
  }
}

/* Fullscreen control: invisible until approached. */
.fullscreen-btn{
  width:36px;height:36px;
  border-radius:12px;
  border:1px solid var(--glass-line);
  background:color-mix(in srgb,var(--glass) 82%,transparent);
  box-shadow:none;
  font-size:15px;
}

/* Secondary control should feel almost absent. */
.settings-dot{
  width:34px;height:34px;
  border:1px solid transparent;
  font-size:17px;
  opacity:.035;
}
.settings-dot:hover,.settings-dot:focus-visible{
  opacity:.50;
  border-color:var(--glass-line);
  background:color-mix(in srgb,var(--glass) 70%,transparent);
}

/* Frosted sheet, no "settings app" feeling. */
.panel{
  width:min(520px,calc(100vw - 24px));
  padding:20px 20px 18px;
  border-radius:26px;
  background:color-mix(in srgb,var(--glass) 88%,transparent);
  box-shadow:0 28px 90px var(--shadow);
}
.panel-head{
  margin-bottom:8px;
}
.close{
  opacity:.48;
}

/* Technical mode controls tucked into Preview disclosure. */
.preview-control{
  margin:0 0 6px;
  border-bottom:1px solid var(--line);
  padding-bottom:12px;
}
.preview-control summary{
  list-style:none;
  cursor:pointer;
  font-size:10px;
  letter-spacing:.08em;
  color:var(--muted2);
  padding:6px 0;
  user-select:none;
}
.preview-control summary::-webkit-details-marker{display:none}
.preview-control summary::after{
  content:"＋";
  float:right;
  font-size:13px;
  opacity:.55;
}
.preview-control[open] summary::after{content:"−"}

.preview-mode{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
  margin-top:8px;
  background:color-mix(in srgb,var(--line) 30%,transparent);
  padding:4px;
  border-radius:12px;
}
.preview-mode button{
  border:0;
  border-radius:9px;
  padding:8px;
  background:transparent;
  color:var(--muted);
  font-size:10px;
}
.preview-mode button.active{
  background:var(--glass);
  color:var(--ink);
}

.details{
  margin-top:8px;
  border-top:0;
  padding-top:6px;
  gap:0;
}
.detail-row{
  padding:11px 0;
  border-bottom:1px solid color-mix(in srgb,var(--line) 75%,transparent);
  font-size:10.5px;
}
.detail-row:last-child{border-bottom:0}
.detail-row b{
  font-weight:450;
  color:color-mix(in srgb,var(--ink) 82%,var(--muted) 18%);
}

.note{
  margin-top:12px;
  font-size:9.5px;
  opacity:.72;
}

@media(max-width:560px){
  .ring-button{width:min(78vw,360px)}
  .readout{margin-top:24px}
}
</style>


<style>
/* v9 — Preview always visible */
.preview-control{
  margin:0 0 6px;
  border-bottom:1px solid var(--line);
  padding-bottom:14px;
}

.preview-label{
  font-size:10px;
  letter-spacing:.08em;
  color:var(--muted2);
  padding:6px 0 8px;
  user-select:none;
}

.preview-control summary,
.preview-control summary::after{
  display:none!important;
}

.preview-mode{
  margin-top:0;
}
</style>


<style>
/* v10 — soften stopped-state tide value */
body:not(.playing) .ring-level{
  color: color-mix(in srgb, var(--ink) 52%, var(--bg) 48%);
  opacity: .78;
  font-weight: 240;
}

body:not(.playing) .ring-level small{
  color: color-mix(in srgb, var(--muted) 62%, var(--bg) 38%);
  opacity: .58;
}

@media (prefers-color-scheme: dark){
  body:not(.playing) .ring-level{
    color: color-mix(in srgb, var(--ink) 46%, var(--bg) 54%);
    opacity: .82;
  }

  body:not(.playing) .ring-level small{
    color: color-mix(in srgb, var(--muted) 54%, var(--bg) 46%);
    opacity: .52;
  }
}
</style>


<style>
/* v11 — pre-play shows only TAP TO PLAY */
body:not(.playing) .ring-level{
  display:none !important;
}

body:not(.playing) .ring-action{
  opacity:.42;
  font-size:9.5px;
  letter-spacing:.18em;
}

body.playing .ring-level{
  display:none !important;
}

body.playing .ring-action{
  opacity:0;
}
</style>


<style>
/* v12 — reveal tide value on hover while playing */
.ring-level{
  transition: opacity .24s ease, transform .24s ease;
}

/* Pre-play stays text-only */
body:not(.playing) .ring-level{
  display:none !important;
}

/* Playing: hidden by default */
body.playing .ring-level{
  display:block !important;
  opacity:0;
  transform:translateY(3px) scale(.985);
  pointer-events:none;
}

/* Hover/focus on ring while playing: show the tide value softly */
@media (hover:hover){
  body.playing .ring-button:hover .ring-level,
  body.playing .ring-button:focus-visible .ring-level{
    opacity:.18;
    transform:translateY(0) scale(1);
  }
}

/* Touch devices: no hover, so keep hidden during playback */
@media (hover:none){
  body.playing .ring-level{
    opacity:0 !important;
  }
}

body.playing .ring-level small{
  opacity:.7;
}
</style>


<style>
/* Audio output routing is handled by the operating system. */
</style>

</head>
<body><main>
  <div id="topRightHotspot" class="top-right-hotspot">
    <div class="corner-actions"><button id="fullscreenBtn" class="corner-btn fullscreen-btn" aria-label="フルスクリーン">⛶</button>
    </div>
  </div>

  <section class="stage">
<button id="ringButton" class="ring-button" aria-label="再生">
      <svg class="ring-svg" viewBox="0 0 420 420" aria-hidden="true">
        <defs>
          <linearGradient id="tidalGradient" x1="58" y1="58" x2="362" y2="362" gradientUnits="userSpaceOnUse">
            <stop offset="0%" style="stop-color:var(--ring-hi);stop-opacity:.92"/>
            <stop offset="26%" style="stop-color:var(--ring);stop-opacity:.95"/>
            <stop offset="52%" style="stop-color:var(--ring-hi);stop-opacity:.92"/>
            <stop offset="76%" style="stop-color:var(--ring-warm);stop-opacity:.55"/>
            <stop offset="100%" style="stop-color:var(--ring);stop-opacity:.92"/>
          </linearGradient>
        </defs>
        <circle class="ring-glow" cx="210" cy="210" r="177"/>
        <circle class="ring-track" cx="210" cy="210" r="177" pathLength="1"/>
      </svg>
      <div class="ring-inner">
        <div class="ring-level"><span id="tideCm">--</span><small>cm</small></div>
        <div id="ringAction" class="ring-action">Tap to play</div>
      </div>
    </button>

    <div class="readout"><span id="nextText">次の潮 --</span></div>
</section>
  <button id="settingsBtn" class="settings-dot" aria-label="詳細設定">⋯</button>
</main>

<section id="panel" class="panel" aria-hidden="true">
  <div class="panel-head">
    <span></span>
    <button id="closeBtn" class="close" aria-label="閉じる">×</button>
  </div>
  <div class="preview-control always-open" id="previewControl">
    <div class="preview-label">Preview</div>
    <div class="preview-mode">
      <button id="autoBtn" class="active">Current</button>
      <button id="simBtn">Manual</button>
    </div>
  </div>
<div class="details">
    <div class="detail-row"><span>流れ</span><b id="detailCurrent">--</b></div>
    <div class="detail-row"><span>潮位</span><b id="detailLevel">--</b></div>
    <div class="detail-row"><span>潮</span><b id="detailDirection">--</b></div>
    <div class="detail-row"><span>次の満干潮</span><b id="detailNext">--</b></div>
    <div class="detail-row"><span>揺らぎ</span><b id="detailEffect">--</b></div>
    <div class="detail-row"><span>更新</span><b id="detailUpdate">--</b></div>
  </div>

  <div id="simPanel" class="sim">
    <div class="row">
      <label>潮流速度</label>
      <input id="simSpeed" type="range" min="0" max="100" value="50">
      <output id="simSpeedV">50%</output>
    </div>
    <div class="row">
      <label>潮位</label>
      <input id="simLevel" type="range" min="20" max="230" value="120">
      <output id="simLevelV">120 cm</output>
    </div>
    <div class="row">
      <label>満干潮からの時間</label>
      <input id="simStill" type="range" min="-20" max="20" value="-20">
      <output id="simStillV">-20 min</output>
    </div>
    <div class="segment" id="simSoundMode">
      <button class="active" data-v="layers">6層</button>
      <button data-v="night">夜の粒感</button>
    </div>
    <div class="segment" id="simDirection">
      <button class="active" data-v="forward">上潮</button>
      <button data-v="reverse">下潮</button>

 document.body.classList.toggle("reverse",s.direction==="reverse");
 document.body.classList.toggle("still",still);
 document.body.classList.toggle("tremolo",trem&&playing);
 document.body.style.setProperty("--rotation-duration",(58-s.speedNorm*28)+"s");
 document.body.style.setProperty("--dir-animation",s.direction==="forward"?"rotateF":"rotateR");

 $("#tideCm").textContent=Math.round(s.levelCm);
 $("#ringAction").textContent=playing?"":"Tap to play";

 if(mode==="auto"&&autoData?.next){
   $("#nextText").textContent=autoData.next.type+" "+fmtTime(autoData.next.time);
 }else{
   $("#nextText").textContent=mode==="auto"?"--":"Preview";
 }

 $("#detailCurrent").textContent=mode==="auto"&&autoData?autoData.currentVelocityKmh.toFixed(2)+" km/h":Math.round(s.speedNorm*100)+"%";
 $("#detailLevel").textContent=Math.round(s.levelCm)+" cm";
 $("#detailDirection").textContent=still?"潮止まり":dir;
 $("#detailNext").textContent=mode==="auto"&&autoData?.next?autoData.next.type+" "+fmtTime(autoData.next.time):"--";
 const nightSound=shouldUseNightSound(s);
 $("#detailEffect").textContent=nightSound?(still?"夜の粒感 · 静穏":"夜の粒感"):(trem?"揺らぎ ON":"通常");
 $("#detailUpdate").textContent=mode==="auto"&&autoData?fmtTime(autoData.fetchedAt):"--";
}

async function togglePlay(){
 await ensureAudio();
 await ensureNightAudio();
 if(!playing){
   playing=true;
   activeSoundMode=null;
   // Prime the six layers on the user gesture; auto night can then switch back at 07:00 without another tap.
   await startSources();
   await syncPlayback(getState(),true);
 }else{
   playing=false;
   activeSoundMode=null;
   clearTrem();
   stopNightEngine();
   await stopSources();
 }
 render();
}
function setMode(m){
 mode=m;
 $("#autoBtn").classList.toggle("active",m==="auto");
 $("#simBtn").classList.toggle("active",m==="sim");
 $("#simPanel").classList.toggle("show",m==="sim");
 if(playing)applyAudio();else render();
 if(m==="auto"&&Date.now()-lastFetch>10*60*1000)fetchAuto();
}
$("#ringButton").addEventListener("click",togglePlay);
$("#settingsBtn").addEventListener("click",()=>{$("#panel").classList.add("open");$("#panel").setAttribute("aria-hidden","false")});
$("#closeBtn").addEventListener("click",()=>{$("#panel").classList.remove("open");$("#panel").setAttribute("aria-hidden","true")});
$("#autoBtn").addEventListener("click",()=>setMode("auto"));
$("#simBtn").addEventListener("click",()=>setMode("sim"));
$("#simSpeed").addEventListener("input",e=>{sim.speedNorm=+e.target.value/100;$("#simSpeedV").value=e.target.value+"%";applyAudio()});
$("#simLevel").addEventListener("input",e=>{sim.levelCm=+e.target.value;$("#simLevelV").value=e.target.value+" cm";applyAudio()});
$("#simStill").addEventListener("input",e=>{sim.minutesFromExtremum=+e.target.value;$("#simStillV").value=(+e.target.value>0?"+":"")+e.target.value+" min";applyAudio()});
$("#simSoundMode").addEventListener("click",e=>{
 const b=e.target.closest("button");if(!b)return;
 sim.soundMode=b.dataset.v;
 [...$("#simSoundMode").querySelectorAll("button")].forEach(x=>x.classList.toggle("active",x===b));
 const layersOff=sim.soundMode==="night";
 $("#simLayerSolo").classList.toggle("disabled",layersOff);
 $("#simLayerSolo").setAttribute("aria-disabled",layersOff?"true":"false");
 if(playing)applyAudio();else render();
});
$("#simDirection").addEventListener("click",e=>{
 const b=e.target.closest("button");if(!b)return;sim.direction=b.dataset.v;
 [...$("#simDirection").querySelectorAll("button")].forEach(x=>x.classList.toggle("active",x===b));
 if(playing)applyAudio();else render();
});
$("#simLayerSolo").addEventListener("click",e=>{
 const b=e.target.closest("button");if(!b)return;
 if(sim.soundMode!=="layers"){
   sim.soundMode="layers";
   [...$("#simSoundMode").querySelectorAll("button")].forEach(x=>x.classList.toggle("active",x.dataset.v==="layers"));
   $("#simLayerSolo").classList.remove("disabled");
   $("#simLayerSolo").setAttribute("aria-disabled","false");
 }
 const i=clamp(Number(b.dataset.layer)||0,0,5);
 sim.layers[i]=!sim.layers[i];
 b.classList.toggle("active",sim.layers[i]);
 b.setAttribute("aria-pressed",sim.layers[i]?"true":"false");
 if(playing)applyAudio();
 else render();
});


async function toggleFullscreen(){
  try{
    if(!document.fullscreenElement){
      await document.documentElement.requestFullscreen();
      $("#fullscreenBtn").textContent="×";
      $("#fullscreenBtn").setAttribute("aria-label","フルスクリーンを終了");
    }else{
      await document.exitFullscreen();
    }
  }catch(e){
    console.warn("Fullscreen unavailable",e);
  }
}
$("#fullscreenBtn").addEventListener("click",toggleFullscreen);
document.addEventListener("fullscreenchange",()=>{
  const on=!!document.fullscreenElement;
  $("#fullscreenBtn").textContent=on?"×":"⛶";
  $("#fullscreenBtn").setAttribute("aria-label",on?"フルスクリーンを終了":"フルスクリーン");
});

if(!IPAD_AUDIO_OPTIMIZED)initLayerEngines();

// API: 10分に1回取得。UI/音の状態はローカル計算で1分ごとに更新。
fetchAuto();
setInterval(fetchAuto,10*60*1000);
setInterval(()=>{if(playing)applyAudio();else render()},60*1000);
render();
</script>
</body>
</html>
